name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors via Directory.Build.props, so this is also the lint gate.
        run: dotnet build --no-restore --configuration Release

      # Integration tests own the Testcontainers category and are excluded here: spinning
      # up Oracle costs minutes, and this job exists to give fast feedback on every push.
      - name: Unit tests
        run: >
          dotnet test --no-build --configuration Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  integration:
    name: Integration tests (PostgreSQL + Oracle)
    runs-on: ubuntu-latest
    # Oracle needs several minutes to become healthy; the default 360 would mask a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Integration tests
        # Testcontainers manages the database lifecycle itself, so no service block here.
        run: >
          dotnet test --configuration Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
