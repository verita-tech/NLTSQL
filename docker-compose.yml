# =====================================================================
# NLTSQL prototype stack.
#
#   warehouse    demo Postgres warehouse (replace with the customer DWH)
#   cube         semantic layer: REST API for the app, SQL API for Metabase
#   metabase-db  Metabase application database
#   metabase     Metabase 0.63, connected to Cube's SQL API
#   app          the Blazor front end (profile "app")
#
# Only Metabase and the app publish ports by default; the warehouse and
# Cube stay on the internal network. Cube is deliberately not reachable
# from a browser — every Cube call is made server-side with a signed JWT.
#
#   docker compose up -d                  infra only, run the app from the IDE
#   docker compose --profile app up -d    everything, including the app
# =====================================================================

name: nltsql

services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      # Applied once, in file name order, on first start of an empty volume.
      - ./infra/warehouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-ops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cube:
    image: cubejs/cube:v1.7.23
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: warehouse
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: ${POSTGRES_DB:-ops}
      # Read-only role created by infra/warehouse/01_schema.sql.
      CUBEJS_DB_USER: cube_reader
      CUBEJS_DB_PASS: cube_reader

      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?CUBEJS_API_SECRET is required}
      CUBEJS_DEV_MODE: ${CUBEJS_DEV_MODE:-true}
      CUBEJS_LOG_LEVEL: warn

      # Postgres-wire SQL API. This is what Metabase connects to, so that
      # Metabase reads the governed metrics instead of raw tables.
      CUBEJS_PG_SQL_PORT: 15432
      CUBEJS_SQL_USER: ${CUBEJS_SQL_USER:-metabase}
      CUBEJS_SQL_PASSWORD: ${CUBEJS_SQL_PASSWORD:?CUBEJS_SQL_PASSWORD is required}
    volumes:
      - ./infra/cube/model:/cube/conf/model:ro
      - ./infra/cube/cube.js:/cube/conf/cube.js:ro
      - cube-cache:/cube/conf/.cubestore
    ports:
      # Exposed for the developer playground only; the app talks to Cube
      # over the internal network. Drop this in a shared deployment.
      - "${CUBE_API_PORT:-4000}:4000"
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  metabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-change-me-metabase-db}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.63.13
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-change-me-metabase-db}
      # Must match METABASE_EMBEDDING_SECRET_KEY used by the app to sign
      # embed tokens, otherwise Metabase rejects the preview iframe.
      MB_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET_KEY:?METABASE_EMBEDDING_SECRET_KEY is required}
      MB_ENABLE_EMBEDDING_STATIC: "true"
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3000}
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
      cube:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Nltsql.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Cube__BaseUrl: http://cube:4000
      Cube__ApiSecret: ${CUBEJS_API_SECRET}
      Metabase__BaseUrl: http://metabase:3000
      # Browsers load the embed iframe, so this must be the URL a browser
      # can reach — not the internal service name.
      Metabase__PublicUrl: http://localhost:${METABASE_PORT:-3000}
      Metabase__ApiKey: ${METABASE_API_KEY}
      Metabase__EmbeddingSecretKey: ${METABASE_EMBEDDING_SECRET_KEY}
      Metabase__CubeDatabaseId: ${METABASE_CUBE_DATABASE_ID}
      Planner__ApiKey: ${ANTHROPIC_API_KEY}
      ConnectionStrings__AppDb: Data Source=/data/nltsql.db
    volumes:
      - app-data:/data
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      cube:
        condition: service_healthy
    restart: unless-stopped

volumes:
  warehouse-data:
  metabase-db-data:
  cube-cache:
  app-data:
